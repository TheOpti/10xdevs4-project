name: AI code review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions: {}

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.action != 'labeled' ||
      (github.event.label.name == 'ai-cr:review' && github.event.sender.type == 'User'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: >-
        ai-code-review-${{ github.repository }}-${{
        (github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        (github.event.action != 'labeled' ||
        (github.event.label.name == 'ai-cr:review' && github.event.sender.type == 'User')))
        && format('pr-{0}', github.event.pull_request.number) || format('ignored-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - uses: ./.github/actions/ai-code-review
        with:
          github-token: ${{ github.token }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          model: ${{ vars.AI_REVIEW_MODEL }}
